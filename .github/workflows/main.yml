name: Python Automation Check

# This tells GitHub WHEN to run the script (on every 'push')
on: [push]

jobs:
  build:
    # This tells GitHub WHAT kind of server to use (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run my automation script
      run: python my_script.py
